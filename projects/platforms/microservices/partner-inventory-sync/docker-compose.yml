version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticmq:
    image: softwaremill/elasticmq-native:1.5.10
    ports:
      - '9324:9324'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inventory
      PARTNER_API_KEY: dev-partner-key
      QUEUE_BACKEND: db
      AWS_REGION: us-east-1
    depends_on:
      - postgres
    ports:
      - '8000:8000'

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inventory
      QUEUE_BACKEND: db
    depends_on:
      - postgres

volumes:
  postgres_data:
